<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>¡Fuera de mi Finca!</title>
<meta name="description" content="Juego de cartas para dos jugadores ambientado en el campo: compra maquinaria, levanta instalaciones y arrasa la cosecha de tu vecino.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%2332220f'/%3E%3Cpath fill='%23eab73d' d='M5.600 2.600h4.800l-1 1.900c2.100 1 3.400 3 3.400 5.200 0 2.500-1.800 3.700-4.800 3.700s-4.800-1.200-4.800-3.700c0-2.200 1.300-4.200 3.400-5.200z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=Rokkitt:wght@600;700;800&family=Rye&family=Special+Elite&display=swap" rel="stylesheet">
<style>
:root{
  /* Mesa de tablones a una pantalla: arriba la finca del vecino, en medio la feria, abajo tu finca y tu mano;
     a la derecha la carta señalada y el cuaderno de campo. Cartas de arpillera con lacre y sellos de tinta. */
  --soil:#1c130a;
  --panel:#32220f;
  --panel-2:#4a3319;
  --line:#7a5a35;
  --bone:#f1e2c0;
  --ink:#3b2412;
  --mute:#cdb48a;
  --wheat:#eab73d;
  --plough:#ea6d4e;
  --land:#a6cf6f;
  --wheat-d:#a06e00;
  --plough-d:#a8321b;
  --land-d:#4d7d2a;
  --display:'Rokkitt','Rockwell','Georgia',serif;
  --title:'Rye','Rokkitt','Georgia',serif;
  --stamp:'Special Elite','Courier New',monospace;
  --body:'Barlow','Segoe UI',system-ui,sans-serif;
  --cond:'Barlow Condensed','Arial Narrow',sans-serif;
  --cwn:clamp(74px, min(calc((100vh - 182px) / 4.86), calc((100vw - 384px) / 8)), 180px);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--soil);color:var(--bone);font:400 15px/1.45 var(--body);overflow:hidden}
#land{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
button{font:700 15px var(--display);letter-spacing:.02em;color:var(--bone);background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:7px 14px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--mute)}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--wheat);color:#241a02;border-color:var(--wheat)}
button.primary:hover:not(:disabled){filter:brightness(1.08)}
button.danger{color:var(--plough);border-color:color-mix(in srgb,var(--plough) 55%,var(--line))}
button.ghost{background:transparent}
button.sm{padding:3px 9px;font-size:13px}
:focus-visible{outline:2px solid var(--wheat);outline-offset:2px}
input[type=text]{font:700 18px var(--display);letter-spacing:.2em;text-transform:uppercase;background:var(--soil);color:var(--bone);border:1px solid var(--line);border-radius:6px;padding:6px 12px;width:7.5em}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
.num{font-variant-numeric:tabular-nums}

/* ---------- carta: la misma estructura en todas; la silueta, el marco y la cabecera dicen el gremio ---------- */
.card{--cw:var(--cwn);--fr:color-mix(in srgb,var(--fc) 70%,#2a190b);--shape:inset(0 round .5em);width:var(--cw);height:calc(var(--cw)*1.62);font-size:calc(var(--cw)/10);flex:none;position:relative;color:#3b2412;user-select:none;filter:drop-shadow(0 .22em .28em rgba(0,0,0,.55));transition:transform .14s ease,filter .14s ease}
.card.sm{--cw:calc(var(--cwn)*.74)}
.card.xl{--cw:196px}
.card.f-V{--shape:polygon(0 1em,50% 0,100% 1em,100% 100%,0 100%)}
.card.f-L{--shape:inset(0 round 50% 50% .45em .45em/1.55em 1.55em .45em .45em)}
.card.f-S{--shape:polygon(1.15em 0,calc(100% - 1.15em) 0,100% 1.15em,100% calc(100% - .55em),calc(100% - .55em) 100%,.55em 100%,0 calc(100% - .55em),0 1.15em)}
.card.f-M{--shape:polygon(0 .9em,12.5% 0,25% .9em,37.5% 0,50% .9em,62.5% 0,75% .9em,87.5% 0,100% .9em,100% 100%,0 100%)}
.card.f-D{--shape:polygon(0 .95em,26% .95em,33% 0,67% 0,74% .95em,100% .95em,100% 100%,0 100%)}
.card .frame,.card .paper{position:absolute;clip-path:var(--shape)}
.card .frame{inset:0;background:var(--fr)}
.card .paper{inset:.3em;display:flex;flex-direction:column;background-color:#dcc59a;background-image:repeating-linear-gradient(90deg,rgba(90,58,30,.08) 0 .08em,transparent .08em .3em),repeating-linear-gradient(0deg,rgba(90,58,30,.07) 0 .08em,transparent .08em .3em)}
/* 1 · cabecera del gremio */
.card .crown{flex:none;height:1.6em;background:var(--fc);display:flex;align-items:flex-end;justify-content:center;gap:.22em;padding-bottom:.16em;color:#2a190b;border-bottom:.12em solid #2a190b}
.card .crown span{font:800 .76em/1 var(--display);text-transform:uppercase;letter-spacing:.1em}
.card .crown .gi{width:.86em;height:.86em}
/* 2 · precio: siempre arriba a la izquierda */
.card .cost{position:absolute;z-index:3;left:.12em;top:.95em;width:1.9em;height:1.9em;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#b04a30,#7a2416);color:#f3e3bd;box-shadow:0 0 0 .1em #4a160c,0 .15em .3em rgba(0,0,0,.5);font:400 1.02em/1 var(--title)}
/* 3 · dibujo */
.card .art{flex:none;height:5em;margin:.18em .2em 0;position:relative;overflow:hidden;border:.1em solid #3b2412;border-radius:.12em;background:#efe2c2}
.card .art svg{position:absolute;inset:0;display:block;width:100%;height:100%}
.card .art::after{content:'';position:absolute;inset:0;z-index:1;pointer-events:none;box-shadow:inset 0 0 .9em rgba(59,36,18,.32)}
.card .art>span{z-index:2}
.subj :is(rect,circle,ellipse,polygon,path):not([fill="none"]){stroke:#2a190b;stroke-width:.75;stroke-linejoin:round;paint-order:stroke}
.subj .ht{stroke:none}
.card .ty{position:absolute;right:.22em;top:.22em;background:rgba(226,205,163,.95);color:#3b2412;box-shadow:inset 0 0 0 .08em #3b2412;font:400 .62em/1 var(--stamp);text-transform:uppercase;letter-spacing:.04em;transform:rotate(-2deg);border-radius:.1em;padding:.3em .45em .12em}
.card .def{position:absolute;right:.22em;bottom:.22em;min-width:1.8em;height:1.9em;padding:0 .3em;display:grid;place-items:center;font:400 1em/1 var(--title);background:#5a3a1e;color:#ecd9b0;border:.12em solid #ecd9b0;border-radius:.3em .3em 1em 1em;box-shadow:0 .1em .3em rgba(0,0,0,.5)}
.card .def.op{background:#ecd9b0;color:#3b2412;border-color:#3b2412}
/* 4 · nombre */
.card .nm{flex:none;height:1.4em;display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden}
.card .nm span{font:400 .86em/1 var(--title);letter-spacing:-.01em}
.card .nm.s span{font-size:.72em}
.card .nm.xs span{font-size:.62em}
/* 5 · poderes básicos: monedas, ataque y cosecha, siempre en ese orden */
.card .wells{flex:none;height:1.62em;margin:0 .2em;display:grid;grid-template-columns:repeat(3,1fr);gap:.16em}
.well{display:flex;align-items:center;justify-content:center;gap:.14em;border-radius:.25em;box-shadow:inset 0 0 0 .11em currentColor}
.well b{font:400 1em/1 var(--title)}
.well .gi{width:.92em;height:.92em}
.well.t{background:#f2da90;color:#6a4600}.well.c{background:#f0c4b3;color:#8c2a17}.well.a{background:#d7e4b4;color:#33601e}
.well.nil{background:none;color:rgba(59,36,18,.26);box-shadow:inset 0 0 0 .07em rgba(59,36,18,.22)}
/* 6 · habilidad */
.card .abil{flex:none;height:2.72em;margin:.16em .2em 0;display:flex;align-items:center;justify-content:center;border-top:.08em dashed #7a5a35;border-bottom:.08em dashed #7a5a35}
.card .abil.nil::before{content:'';width:1.4em;height:.1em;background:rgba(59,36,18,.25)}
.card .row{display:flex;flex-wrap:wrap;gap:.14em .2em;justify-content:center;align-items:center}
/* 7 · aliado (o desguace): siempre abajo */
.card .slot3{flex:1;min-height:0;margin:.42em .2em .2em;position:relative;border-radius:.2em;display:flex;align-items:center;justify-content:center;padding-top:.3em}
.card .slot3 .tab{position:absolute;top:-.52em;left:.3em;display:flex;align-items:center;gap:.28em;font:400 .64em/1 var(--stamp);text-transform:uppercase;letter-spacing:.04em;padding:.3em .5em .1em .4em;border-radius:.12em;background:var(--fr);color:#f6e6c4;white-space:nowrap}
.card .slot3 .tab .gi{width:1em;height:1em;margin-top:-.2em;color:var(--fc)}
.card .slot3.al{background:color-mix(in srgb,var(--fc) 36%,#dcc59a);box-shadow:inset 0 0 0 .1em var(--fr)}
.card .slot3.sx{background:rgba(59,36,18,.13);box-shadow:inset 0 0 0 .1em #5a3a1e}
.card .slot3.sx .tab{background:#3b2412}.card .slot3.sx .tab .gi{color:#eab73d}
.card .slot3 .row{flex-wrap:nowrap}
.card .slot3.two .row{font-size:.8em}
.card .slot3.nil{box-shadow:inset 0 0 0 .07em rgba(59,36,18,.2)}
.card .slot3.nil::before{content:'';width:1.4em;height:.1em;background:rgba(59,36,18,.25);margin-top:-.3em}
.card .slot3.al.off{opacity:.5}
.card .slot3.al.on{background:var(--fc)}
.card .slot3.al.on .tab::after{content:'✓';margin-left:.1em}
.card .slot3.al.ready{animation:ready 1.3s ease-in-out infinite;animation-delay:var(--sync)}
@keyframes ready{50%{background:var(--fc);box-shadow:inset 0 0 0 .1em var(--fr),0 0 .5em var(--fc)}}
/* fichas de efecto */
.tk{display:inline-flex;align-items:center;gap:.14em;min-height:1.22em;max-width:100%;padding:0 .34em 0 .22em;border-radius:.25em;white-space:nowrap;box-shadow:inset 0 0 0 .1em currentColor}
.tk b{font:400 .92em/1 var(--title)}
.tk .gi{width:.84em;height:.84em;flex:none}
.tk.t{background:#f2da90;color:#6a4600}.tk.c{background:#f0c4b3;color:#8c2a17}.tk.a{background:#d7e4b4;color:#33601e}
.tk.w{background:#ecdcb6;color:#3b2412}
.tk.x{background:#8c2a17;color:#f6e6c4;box-shadow:inset 0 0 0 .1em #4a160c}.tk.x .gi{color:#f2b632}
.tk.w b,.tk.x b{font:700 .74em/1 var(--cond);text-transform:uppercase;letter-spacing:.03em}
.tk i{display:inline-flex;align-items:center;gap:.05em;font:400 .8em/1 var(--title);font-style:normal;margin-left:.08em}
.tk i .gi{width:.9em;height:.9em}
.gi{display:inline-block;width:1em;height:1em;vertical-align:-.12em;flex:none}
/* estados */
.card[data-act]{cursor:pointer}
.card.can:hover{transform:translateY(-.55em) rotate(-.8deg);filter:drop-shadow(0 0 .1em var(--wheat)) drop-shadow(0 0 .14em var(--wheat)) drop-shadow(0 .6em .5em rgba(0,0,0,.6))}
.card.no{filter:saturate(.45) brightness(.6) drop-shadow(0 .22em .28em rgba(0,0,0,.55))}
.card.no[data-act]{cursor:not-allowed}
.card.target{cursor:crosshair;filter:drop-shadow(0 0 .12em var(--plough)) drop-shadow(0 0 .3em var(--plough));animation:aim 1.2s ease-in-out infinite;animation-delay:var(--sync)}
@keyframes aim{50%{filter:drop-shadow(0 0 .2em var(--plough)) drop-shadow(0 0 .75em var(--plough))}}
.card.target:hover{transform:translateY(-.4em)}
.card.pick{filter:drop-shadow(0 0 .12em var(--wheat)) drop-shadow(0 0 .4em var(--wheat))}
.card .badge{position:absolute;z-index:3;left:.5em;top:5.3em;background:#5a3a1e;color:#ecd9b0;font:400 .82em/1 var(--stamp);padding:.3em .45em .08em;border-radius:.2em;box-shadow:0 0 0 .08em #ecd9b0}
.card .scrapbtn{position:absolute;z-index:4;left:.5em;right:.5em;bottom:.5em;padding:.42em .2em .2em;font:400 1em/1 var(--stamp);background:#5a3a1e;color:#ecd9b0;border:.12em solid var(--wheat);border-radius:.3em}
.card .scrapbtn:hover{background:var(--wheat);color:#3b2412}
.slot{width:var(--cwn);height:calc(var(--cwn)*1.62);flex:none;border:1px dashed var(--line);border-radius:8px;display:grid;place-items:center;color:var(--mute);font:500 12px var(--cond);text-transform:uppercase;letter-spacing:.1em}
.lgd{display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center;font:500 13px var(--body);color:var(--mute)}
.lgd span{display:inline-flex;align-items:center;gap:6px}
.lgd .tk{font-size:13px}

/* cabecera: un toldo con el nombre del gremio; la cenefa que cuelga cambia con cada gremio */
.card.f-V,.card.f-L,.card.f-S,.card.f-D,.card.f-M{--shape:inset(0 round .5em)}
.card .paper{box-shadow:inset 0 0 0 .06em rgba(42,25,11,.45),inset 0 0 1.4em rgba(90,58,30,.22)}
.card .crown{height:1.95em;padding:0 .3em 0 1.95em;align-items:center;gap:.26em;border-bottom:0;position:relative;background:repeating-linear-gradient(90deg,transparent 0 .62em,rgba(255,255,255,.17) .62em 1.24em),linear-gradient(rgba(255,255,255,.2),transparent 45%,rgba(42,25,11,.12)),var(--fc)}
.card .crown::after{content:'';position:absolute;left:.15em;right:.15em;bottom:.2em;border-top:.06em dashed rgba(42,25,11,.5)}
.card .crown span{font:800 1.04em/1 var(--display);letter-spacing:.09em;padding-bottom:.12em}
.card .crown .gi{width:1.05em;height:1.05em;margin-bottom:.1em}
.card .val{position:absolute;left:0;right:0;top:1.95em;height:.58em;z-index:2;pointer-events:none;filter:drop-shadow(0 .07em 0 #2a190b) drop-shadow(0 .12em .1em rgba(0,0,0,.35))}
.card .val::after{content:'';position:absolute;inset:0;background:linear-gradient(rgba(42,25,11,.16),transparent 70%),var(--fc);-webkit-mask:var(--vm);mask:var(--vm)}
.card.f-V{--vm:conic-gradient(from -45deg at 50% 100%,#000 90deg,#0000 0) 50% 0/.94em 100% repeat-x}
.card.f-L{--vm:radial-gradient(circle farthest-side at 50% 0,#000 96%,#0000) 50% 0/1.16em 100% repeat-x}
.card.f-S{--vm:linear-gradient(90deg,#000 50%,#0000 0) 50% 0/.94em 100% repeat-x}
.card.f-D{--vm:radial-gradient(circle farthest-side at 50% 100%,#0000 96%,#000) 50% 0/1.16em 100% repeat-x}
.card.f-M{--vm:linear-gradient(to bottom right,#000 50%,#0000 0) 50% 0/.78em 100% repeat-x}
.card.f-N .val{height:.14em;filter:none}
.card.f-N .val::after{background:#2a190b;-webkit-mask:none;mask:none}
.card .cost{left:.04em;top:.02em;width:1.95em;height:1.95em;border-radius:50% 46% 52% 48%/48% 52% 46% 50%;box-shadow:0 0 0 .1em #4a160c,inset 0 0 0 .16em rgba(255,255,255,.13),inset 0 -.2em .3em rgba(0,0,0,.25),0 .15em .3em rgba(0,0,0,.5);font-size:1.06em}
.card .ty{top:.74em}
.card .badge{top:5.9em}
/* ---------- partida: feria a la izquierda y tres filas iguales (el vecino, tú y tu mano); nada tapa nada ---------- */
.top{flex:none;position:relative;z-index:6;display:flex;align-items:center;gap:14px;height:48px;padding:0 16px;border-bottom:2px solid #24160a;background:#32220f}
.brand{flex:none;font:400 17px/1 var(--title);letter-spacing:.01em;white-space:nowrap}
.brand b{color:var(--wheat);font-weight:400}
.turn{flex:none;font:800 15px/1.2 var(--display);text-transform:uppercase;letter-spacing:.08em;padding:4px 12px;border-radius:4px;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.turn.mine{background:var(--wheat);color:#241a02;border-color:var(--wheat)}
.hint{flex:3 1 0;min-width:0;font:500 13.5px/1.3 var(--body);color:var(--bone);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hint button{margin-left:8px}
.hint.alert{color:var(--plough);font-weight:600}
.tick{flex:2 1 0;min-width:0;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:500 13px var(--body);color:var(--mute)}
.tick b{color:var(--bone);font-weight:600}
.tick.new{animation:slide .4s ease-out}
.top-r{flex:none;display:flex;align-items:center;gap:8px;white-space:nowrap}
.code{font:700 13px var(--display);letter-spacing:.12em;color:var(--mute);text-transform:uppercase}
.campo{flex:1;min-height:0;display:grid;grid-template-columns:auto minmax(0,1fr);overflow:hidden auto;background:#6b5233}
.feria{position:relative;z-index:2;display:flex;flex-direction:column;gap:8px;padding:10px 24px 10px 16px;background:repeating-linear-gradient(90deg,rgba(0,0,0,.05) 0 3px,transparent 3px 9px),#6b5233}
.feria::after{content:'';position:absolute;right:-8px;top:0;bottom:0;width:16px;pointer-events:none;background:repeating-linear-gradient(0deg,#2f1e0e 0 9px,transparent 9px 70px),linear-gradient(90deg,transparent 3px,#c9a36a 3px 7px,transparent 7px 10px,#c9a36a 10px 14px,transparent 14px)}
.market-row{display:grid;grid-template-columns:repeat(2,auto);gap:10px;align-content:start;justify-content:start}
.sign{align-self:flex-start;font:700 12px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:#f1e2c0;background:rgba(28,19,10,.84);padding:5px 9px 4px;border-radius:4px;white-space:nowrap}
.sign em{font:500 12px var(--body);letter-spacing:0;text-transform:none;font-style:normal;color:#cdb48a;margin-left:6px}
.mesa{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 236px;grid-template-rows:auto auto minmax(0,1fr);gap:0 14px;padding:0 14px 0 22px;min-width:0}
.bg{position:relative;z-index:0;margin:0 -14px 0 -22px}
.bg.o{grid-area:1/1/2/3;background:repeating-linear-gradient(90deg,#3f6426 0 14px,#375a21 14px 28px)}
.bg.m{grid-area:2/1/4/3;background:repeating-linear-gradient(90deg,#86692b 0 14px,#795e25 14px 28px)}
.bg::before{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 45%,rgba(0,0,0,.3))}
.bg.on::before{background:radial-gradient(ellipse at 45% 50%,rgba(255,236,170,.12),transparent 60%,rgba(0,0,0,.24))}
.bg.o::after{content:'';position:absolute;left:0;right:0;bottom:-8px;height:16px;z-index:2;pointer-events:none;background:repeating-linear-gradient(90deg,#2f1e0e 0 9px,transparent 9px 70px),linear-gradient(transparent 3px,#c9a36a 3px 7px,transparent 7px 10px,#c9a36a 10px 14px,transparent 14px)}
.lane,.dock{position:relative;z-index:1;grid-column:1;min-width:0;container-type:inline-size}
.lane{display:flex;gap:18px;align-items:flex-start}
.lane.opp{grid-row:1;padding:8px 0 14px}
.lane.me{grid-row:2;padding:12px 0 4px}
.dock{grid-row:3;display:flex;flex-direction:column;gap:4px;padding:4px 0 8px}
.zone{display:flex;flex-direction:column;gap:4px;min-width:0}
.zone.grow{flex:1}
.cards{display:flex;gap:8px;align-items:flex-start;height:calc(var(--cwn)*1.62)}
.dock .cards{justify-content:center}
.cw{flex:none}
.lane .card,.dock .card{--cw:min(var(--cwn),calc((100cqw - var(--g,0px)) / var(--n,1)))}
.empty{align-self:stretch;width:calc(var(--cwn)*1.5);max-width:100%;display:grid;place-items:center;text-align:center;border:1px dashed rgba(241,226,192,.4);border-radius:8px;color:rgba(241,226,192,.75);font:600 11px var(--cond);letter-spacing:.1em;text-transform:uppercase;padding:0 12px}
.zone.grow .empty{width:100%}
.side-o,.side-m{position:relative;z-index:1;grid-column:2;min-width:0}
.side-o{grid-row:1;align-self:center}
.side-m{grid-row:2/4;display:flex;flex-direction:column;gap:8px;padding:12px 0 8px;min-height:0;contain:size;overflow:hidden}
/* letrero de cada finca: cosecha y pilas, siempre fuera de las cartas */
.plq{display:flex;flex-direction:column;gap:7px;background:linear-gradient(#4a3019,#3b2613);border:2px solid #24160a;border-radius:8px;padding:8px 10px;color:#f1e2c0;box-shadow:0 4px 10px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,220,160,.12);min-width:0}
.plq.on{border-color:var(--wheat);animation:glow 2.4s ease-in-out infinite;animation-delay:var(--sync)}
@keyframes glow{0%,100%{box-shadow:0 4px 10px rgba(0,0,0,.45),0 0 0 0 rgba(234,183,61,0)}50%{box-shadow:0 4px 10px rgba(0,0,0,.45),0 0 0 4px rgba(234,183,61,.28)}}
.pn{font:700 16px/1.1 var(--display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pstate{font:600 11px var(--cond);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);display:flex;align-items:center;gap:9px;white-space:nowrap}

.conn{display:inline-flex;align-items:center;gap:5px;color:#b9b2a2;white-space:nowrap}
.conn::before{content:'';width:8px;height:8px;border-radius:50%;background:#8d877b}
.conn.c-game{color:var(--land)}.conn.c-game::before{background:var(--land);animation:pulse 1.8s ease-in-out infinite;animation-delay:var(--sync)}
.conn.c-lobby{color:var(--wheat)}.conn.c-lobby::before{background:var(--wheat)}
.prow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ps{display:flex;align-items:center;gap:6px;font:800 34px/1 var(--display)}
.ps .gi{width:22px;height:22px}
.ps b{display:inline-block}
.ps small{font:600 11px var(--cond);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.plq.me .ps{color:var(--land)} .plq.op .ps{color:var(--plough)}
.hbar{position:relative;height:8px;border-radius:4px;background:rgba(0,0,0,.5);overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.5)}
.hbar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.plq.me .hbar i{background:repeating-linear-gradient(90deg,#6fae3a 0 5px,#5b9630 5px 7px)}
.plq.op .hbar i{background:repeating-linear-gradient(90deg,#d95a3a 0 5px,#b84526 5px 7px)}
.piles{display:flex;gap:4px}
.pile{display:flex;align-items:center;gap:5px;padding:4px 6px 3px;background:var(--soil);border:1px solid var(--line);border-radius:6px;color:var(--bone)}
.pile .stack{width:11px;height:16px;border-radius:3px;flex:none;background:repeating-linear-gradient(90deg,rgba(90,58,30,.25) 0 1px,transparent 1px 4px),#dcc59a;box-shadow:2px 2px 0 #5a3a1e,0 0 0 1px #3b2412}
.pile b{font:800 15px/1 var(--display)}
.pile small{font:600 9px/1 var(--cond);text-transform:uppercase;letter-spacing:.05em;color:var(--mute)}
button.pile{cursor:pointer}
button.pile:hover{border-color:var(--wheat)}
/* caja de acciones */
.res{flex:none;display:flex;flex-direction:column;gap:6px;min-width:0;background:rgba(28,19,10,.86);border:1px dashed var(--line);border-radius:10px;padding:8px 10px}
.res.idle{align-items:center;text-align:center;color:var(--mute);font:600 12px var(--cond);text-transform:uppercase;letter-spacing:.1em;padding:14px 10px}
.pools{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pool{border:1px solid var(--line);border-radius:6px;padding:3px 8px;background:var(--soil)}
.pool .k{font:700 11px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.pool .v{font:800 28px/1.05 var(--display);display:flex;align-items:center;gap:6px;transform-origin:0 50%}
.pool.t .v{color:var(--wheat)} .pool.c .v{color:var(--plough)}
.pool .gi{width:20px;height:20px}
.pools.mini .pool{padding:2px 6px}
.pools.mini .pool .k{font-size:9.5px}
.pools.mini .pool .v{font-size:19px}.pools.mini .pool .gi{width:14px;height:14px}
button.attack{padding:6px 8px;font-size:14px;line-height:1.1}
button.attack:not(:disabled){background:#8c2a17;border-color:#c24a2f;color:#f6e6c4}
button.attack:not(:disabled):hover{filter:brightness(1.12)}
.pend{display:flex;flex-direction:column;gap:4px}
.pend button{text-align:left;padding:3px 8px;font-size:13px;border-color:var(--wheat);color:var(--wheat);background:transparent}
.btns{display:flex;gap:6px}
.btns button{flex:1;padding:8px 2px;font-size:13.5px;line-height:1.1;white-space:nowrap}
.res .undo{padding:5px 8px}
button.nudge{animation:nudge 1.6s ease-in-out infinite;animation-delay:var(--sync)}
@keyframes nudge{0%,100%{box-shadow:0 0 0 0 rgba(234,183,61,.55)}60%{box-shadow:0 0 0 8px rgba(234,183,61,0)}}
button:active:not(:disabled){transform:translateY(1px)}
/* carta señalada: explicación en un recuadro fijo */
.info{flex:1 1 0;min-height:0;overflow:auto;background:rgba(28,19,10,.86);border:1px dashed var(--line);border-radius:10px;padding:8px 10px;font:500 12.5px/1.36 var(--body);color:var(--bone)}
.info .k2{font:700 11px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-bottom:2px}
.info b{font:700 14.5px var(--display)}
.info .dim{color:var(--mute)}
/* las cartas no se levantan ni se montan; el recuadro de desguace se pulsa */
.card.can:hover,.card.target:hover{transform:none}
.card.can:hover{filter:drop-shadow(0 0 .12em var(--wheat)) drop-shadow(0 0 .22em var(--wheat)) drop-shadow(0 .22em .28em rgba(0,0,0,.55))}
.card .slot3.sx.go{cursor:pointer;background:#f2da90;box-shadow:inset 0 0 0 .14em #a06e00;animation:ready 1.6s ease-in-out infinite;animation-delay:var(--sync);--fc:#eab73d;--fr:#a06e00}
.card .slot3.sx.go .tab{background:#a06e00;color:#fff6dc}
.card .slot3.sx.go .tab .gi{color:#fff6dc}
.card .slot3.sx.go:hover{background:#ffe9a8}
.legend{display:flex;gap:12px;flex-wrap:wrap;font:600 12px var(--cond);letter-spacing:.06em;text-transform:uppercase;color:var(--mute);justify-content:center}
.log{overflow:auto;max-height:60vh;font:400 13.5px/1.35 var(--body);display:flex;flex-direction:column;gap:10px;min-width:min(520px,80vw)}
.lg{display:flex;flex-direction:column;gap:2px}
.lh{font:700 12px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);display:flex;justify-content:space-between;gap:8px}
.lh span{letter-spacing:.02em;text-transform:none}
.le{padding-left:9px;border-left:3px solid var(--line);color:var(--mute)}
.lg.me .le{border-color:var(--wheat);color:var(--bone)}
.lg.me .lh span{color:var(--wheat)}
@keyframes slide{from{opacity:0;transform:translateX(14px)}}
/* tutorial */
.coach{position:fixed;z-index:6;width:310px;pointer-events:auto;background:#ecdcb6;color:#3b2412;border:2px solid #3b2412;border-radius:10px;padding:11px 14px 9px;box-shadow:0 10px 26px rgba(0,0,0,.6);font:500 14.5px/1.4 var(--body)}
.coach .n{font:400 11px var(--stamp);letter-spacing:.06em;text-transform:uppercase;color:#7a2416;margin-bottom:4px}
.coach p{margin:0}
.coach .f{display:flex;justify-content:space-between;align-items:center;margin-top:9px;gap:8px}
.coach button{cursor:pointer}
.coach .next{font:700 14px var(--display);padding:6px 16px;border-radius:6px;background:#8c2a17;color:#f6e6c4;border:1px solid #4a160c}
.coach .skip{background:none;border:0;color:#7a5a35;font:600 12px var(--cond);letter-spacing:.06em;text-transform:uppercase;padding:4px 0}
.coach .skip:hover{color:#3b2412}
.coach .do{font:700 12px var(--cond);letter-spacing:.08em;text-transform:uppercase;color:#7a2416}
.coach::after{content:'';position:absolute;width:14px;height:14px;background:#ecdcb6;border:2px solid #3b2412;border-top:0;border-left:0}
.coach.s-top::after{left:var(--ax,50%);bottom:-9px;transform:translateX(-50%) rotate(45deg)}
.coach.s-bottom::after{left:var(--ax,50%);top:-9px;transform:translateX(-50%) rotate(-135deg)}
.coach.s-left::after{top:var(--ay,50%);right:-9px;transform:translateY(-50%) rotate(-45deg)}
.coach.s-right::after{top:var(--ay,50%);left:-9px;transform:translateY(-50%) rotate(135deg)}
.coach.s-none::after{display:none}
.tut-ring{outline:3px solid var(--wheat);outline-offset:4px;border-radius:8px;animation:nudge 1.6s ease-in-out infinite;animation-delay:var(--sync)}

/* ---------- modal y avisos ---------- */
.veil{position:fixed;inset:0;z-index:20;background:rgba(12,15,7,.8);display:grid;place-items:center;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:10px;max-width:min(920px,100%);max-height:100%;overflow:auto;padding:20px 22px;display:flex;flex-direction:column;gap:14px}
.modal h2{font-size:24px;letter-spacing:.04em;text-transform:uppercase}
.modal .cards{flex-wrap:wrap;overflow:visible;min-height:0}
.modal p{margin:0;max-width:65ch}
.modal ol{margin:0;padding-left:20px;max-width:65ch;display:flex;flex-direction:column;gap:6px}
.modal .foot{display:flex;gap:8px;justify-content:flex-end}
.over h2{font-size:52px;line-height:1;letter-spacing:.08em}
.over.win h2{color:var(--wheat)} .over.lose h2{color:var(--plough)}
.toast{position:fixed;left:50%;bottom:18px;translate:-50% 0;z-index:30;background:var(--bone);color:var(--ink);font:600 14px var(--body);padding:10px 16px;border-radius:6px;box-shadow:0 6px 20px rgba(0,0,0,.5);max-width:calc(100% - 32px)}
.sweep{position:fixed;left:0;right:0;top:38%;z-index:15;pointer-events:none;text-align:center;font:800 64px var(--display);letter-spacing:.16em;text-transform:uppercase;color:var(--wheat);text-shadow:0 2px 0 #000, 0 0 34px rgba(0,0,0,.95);animation:sweep 1.3s ease forwards}
@keyframes sweep{0%{opacity:0;transform:translateX(-8%)}18%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0;transform:translateX(6%)}}

/* ---------- capa de efectos ---------- */
#fx{position:fixed;inset:0;z-index:40;pointer-events:none;overflow:hidden}
.flyer{position:fixed;transform-origin:50% 50%}
.float{position:fixed;transform:translate(-50%,0);font:800 24px/1 var(--display);white-space:nowrap;text-shadow:0 1px 0 #000,0 0 12px #000;animation:floatdn 1.3s ease-out forwards}
.float.up{color:var(--land)} .float.down{color:var(--plough)}
@keyframes floatdn{0%{opacity:0;transform:translate(-50%,-6px) scale(.7)}15%{opacity:1;transform:translate(-50%,6px) scale(1.15)}30%{transform:translate(-50%,10px) scale(1)}100%{opacity:0;transform:translate(-50%,44px)}}
.veil.pop{animation:fadein .2s ease-out}
.veil.pop .modal{animation:pop .28s cubic-bezier(.2,.9,.3,1.2)}
@keyframes fadein{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.94)}}
.toast{animation:pop .25s ease-out}
.intro .hero h1{animation:rise .6s ease-out both}
.intro .hero p{animation:rise .6s ease-out both}
.intro .banner{animation:rise .7s ease-out both}
.intro .pane{animation:rise .6s ease-out both}
.intro .sect{animation:rise .6s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.banner .drift{animation:drift 28s ease-in-out infinite alternate}
.banner .drift.b{animation-duration:36s;animation-direction:alternate-reverse}
@keyframes drift{to{transform:translateX(22px)}}
.banner .chug{animation:chug .36s steps(2,jump-none) infinite}
@keyframes chug{to{transform:translateY(-.55px)}}
.banner .puff{transform-box:fill-box;transform-origin:center;animation:puff 2.2s ease-out infinite}
.banner .puff.b{animation-delay:1.1s}
@keyframes puff{0%{opacity:0;transform:translate(0,0) scale(.5)}15%{opacity:.85}100%{opacity:0;transform:translate(var(--px,-7px),-13px) scale(1.9)}}
.banner .graze{transform-box:fill-box;transform-origin:50% 100%;animation:graze 3.4s ease-in-out infinite}
@keyframes graze{0%,100%{transform:rotate(0)}50%{transform:rotate(2.2deg)}}
.pane.wide{grid-column:1/-1}
.gloss{display:grid;gap:7px 22px;font-size:13px;color:var(--bone)}
.gloss.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.gi-row{display:grid;grid-template-columns:156px minmax(0,1fr);gap:10px;align-items:center}
.gi-row .tk{font-size:13px}
.gi-row>span:last-child{color:var(--mute)}
.modal h2+.gloss{margin-top:-4px}
.sect{grid-column:1/-1;display:flex;align-items:baseline;gap:14px;border-bottom:1px solid var(--line);padding-bottom:6px;margin-top:6px}
.sect h2{font:800 26px/1 var(--display);text-transform:uppercase;letter-spacing:.04em}
.sect p{margin:0;color:var(--mute);font-size:14px}
.waitbox .banner{width:min(520px,100%)}
.fac .card{transition:transform .2s ease}
.fac:hover .card{transform:translateY(-6px) rotate(-1.2deg)}

.float.rise{animation-name:floatup}
.float.t{color:var(--wheat)} .float.c{color:var(--plough)}
@keyframes floatup{0%{opacity:0;transform:translate(-50%,0) scale(.7)}15%{opacity:1;transform:translate(-50%,-14px) scale(1.15)}30%{transform:translate(-50%,-18px) scale(1)}100%{opacity:0;transform:translate(-50%,-52px)}}
.intro .hero h1,.intro .hero p,.intro .banner,.intro .pane,.intro .sect{animation-delay:calc(var(--intro,0ms) + var(--d,0ms))}
.intro .hero p{--d:80ms} .intro .banner{--d:140ms} .intro .pane{--d:260ms} .intro .pane+.pane{--d:340ms} .intro .sect{--d:400ms}
.intro .fac:nth-child(1){--d:440ms} .intro .fac:nth-child(2){--d:520ms} .intro .fac:nth-child(3){--d:600ms} .intro .fac:nth-child(4){--d:680ms}

/* ---------- sala ---------- */
.lobby{flex:1;overflow:auto;padding:22px 24px 40px}
.lobby-in{max-width:1080px;margin:0 auto;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,4fr);gap:24px 36px}
.hero{grid-column:1/-1;display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px 28px;align-items:end}
.hero h1{font-size:clamp(40px,7vw,84px);font-weight:800;line-height:.86;letter-spacing:.005em;text-transform:uppercase;white-space:nowrap}
.hero h1 b{color:var(--wheat);display:block}
.hero p{margin:0;max-width:44ch;color:var(--bone);font-size:16px;padding-bottom:4px}
.banner{grid-column:1/-1;border-radius:10px;overflow:hidden;border:1px solid var(--line);aspect-ratio:300/64;background:#a9d6e6}
.banner svg{display:block;width:100%;height:100%}
.pane{background:color-mix(in srgb,var(--panel) 90%,transparent);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.blk{display:flex;flex-direction:column;gap:12px}
.blk h3{font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.actions button.primary{font-size:19px;padding:10px 20px}
.joinrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.glist{display:flex;flex-direction:column;gap:6px}
.gitem{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:6px;padding:6px 10px;background:var(--soil)}
.gitem .gc{font:800 17px var(--display);letter-spacing:.16em}
.gitem .gd{flex:1;min-width:0;color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note{color:var(--mute);font-size:13px;margin:0;max-width:60ch}
.note.warn{color:var(--wheat)}
.rules-list{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;max-width:62ch;font-size:14px}
.facs{grid-column:1/-1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.fac{display:flex;flex-direction:column;gap:8px;align-items:flex-start;border-top:4px solid var(--fc)}
.fac h4{margin:0;font:800 19px var(--display);letter-spacing:.03em;text-transform:uppercase}
.fac p{margin:0;color:var(--mute);font-size:13px;flex:1}
.fac .card{--cw:150px}
.waitbox{margin:auto;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;padding:28px 32px;background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:12px}
.waitbox .big{font:800 clamp(60px,13vw,120px)/1 var(--display);letter-spacing:.2em;color:var(--wheat);padding-left:.2em}
.waitbox p{margin:0;max-width:52ch;color:var(--mute)}
.pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--land);margin-right:8px;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}

/* mesa y sala con el mismo material */
.hero h1{font-family:var(--title);font-weight:400;letter-spacing:.01em;line-height:.95}
.modal h2,.sect h2,.fac h4,.over h2,.sweep,.waitbox .big,.waitbox h2{font-family:var(--title);font-weight:400}
.modal h2,.sect h2,.fac h4{text-transform:none;letter-spacing:0}
.sweep{font-size:56px;letter-spacing:.06em}
.over h2{font-size:46px;letter-spacing:.04em}
.pane,.waitbox{border-style:dashed}
.banner{border:3px solid #5a3a1e;box-shadow:inset 0 0 0 1px #ecd9b0}
.gi-row .tk{transform:none}

.mscore,.mob{display:none}
input.plain{font:600 15px var(--body);letter-spacing:0;text-transform:none;width:15em;max-width:100%}
.linkbox{font:500 13px var(--body);color:var(--bone);background:var(--soil);border:1px dashed var(--line);border-radius:6px;padding:7px 10px;word-break:break-all;user-select:all;max-width:100%}
.mscore{align-items:center;gap:10px;font:800 17px/1 var(--display)}
.mscore span{display:inline-flex;align-items:center;gap:4px}
.mscore .gi{width:15px;height:15px}
.mscore .me{color:var(--land)}.mscore .op{color:var(--plough)}
.card{-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.cardview{align-items:center}
.cardview .card{--cw:min(230px,62vw)}
.cardview .plain{font:500 14px/1.4 var(--body);max-width:36ch}
.cardview .plain b{font:700 16px var(--display)}
.cardview .plain .k2{display:none}
.cardview .plain .dim{color:var(--mute)}
@media (max-width:900px){
  :root{--cwn:clamp(88px,27vw,124px)}
  .lobby{padding:16px 14px 32px}
  .lobby-in{grid-template-columns:minmax(0,1fr);gap:18px}
  .hero{grid-template-columns:minmax(0,1fr);gap:10px}
  .hero h1{font-size:clamp(30px,10.4vw,64px);white-space:normal}
  .facs{grid-template-columns:repeat(3,minmax(0,1fr))}
  .fac .card{--cw:min(150px,25vw)}
  .gloss.two{grid-template-columns:minmax(0,1fr)}
  .gi-row{grid-template-columns:128px minmax(0,1fr)}
  .sect{flex-direction:column;gap:4px}
  .pane{padding:14px}
  .modal{padding:14px}
  .modal h2{font-size:20px}
  .over h2{font-size:36px}
  .sweep{font-size:34px}
  .coach{width:min(310px,calc(100vw - 16px))}
  .log{min-width:0}
  /* partida: todo en una columna; cada fila de cartas se desliza de lado */
  .top{flex-wrap:wrap;height:auto;padding:6px 10px;gap:5px 8px}
  .brand,.code,.tick{display:none}
  .mscore{display:flex}
  .mob{display:inline}
  .turn{font-size:12.5px;padding:3px 8px}
  .top-r{margin-left:auto;gap:4px}
  .top-r button{padding:3px 7px;font-size:12px}
  .hint{order:5;flex:1 1 100%;white-space:normal;font-size:12.5px}
  .campo{display:flex;flex-direction:column;overflow:hidden auto;background:repeating-linear-gradient(90deg,#86692b 0 14px,#795e25 14px 28px)}
  .mesa,.side-m{display:contents}
  .bg,.info,.feria::after{display:none}
  .side-o{order:1;flex:none;padding:8px 10px 0;background:repeating-linear-gradient(90deg,#3f6426 0 14px,#375a21 14px 28px)}
  .lane.opp{order:2;background:repeating-linear-gradient(90deg,#3f6426 0 14px,#375a21 14px 28px);border-bottom:4px solid #c9a36a}
  .feria{order:3;flex:none;padding:8px 10px 10px;border-bottom:4px solid #c9a36a}
  .plq.me{order:4;flex:none;margin:8px 10px 0}
  .lane.me{order:5}
  .dock{order:6}
  .res{order:7}
  .plq{flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:6px 10px}
  .plq>div:first-child{flex:1 1 auto;min-width:0}
  .plq .hbar{flex:1 1 100%;order:9}
  .plq .pools.mini{flex:1 1 100%;order:10}
  .ps{font-size:26px}
  .ps small{display:none}
  .lane,.dock{flex:none;padding:8px 10px 10px;overflow:auto hidden;-webkit-overflow-scrolling:touch}
  .lane{gap:12px}
  .zone,.zone.grow{flex:none}
  .cards{height:auto;min-height:calc(var(--cwn)*1.62)}
  .dock .cards{justify-content:flex-start}
  .dock .cards::after,.lane::after{content:'';flex:none;width:2px}
  .lane .card,.dock .card{--cw:var(--cwn)}
  .empty{width:calc(var(--cwn)*1.1)}
  .zone.grow .empty{width:calc(var(--cwn)*1.7)}
  .market-row{display:flex;gap:8px;overflow:auto hidden;padding-bottom:4px;-webkit-overflow-scrolling:touch}
  .market-row>*{flex:none}
  .res{position:sticky;bottom:0;z-index:5;flex:none;margin-top:auto;border:0;border-top:2px solid #24160a;border-radius:0;background:#32220f;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px))}
  .res .pools{grid-column:span 3}
  .res .attack{grid-column:span 3;font-size:13px}

}

    const arr = target.zone === 'hand' ? p.hand : p.discard; if (target.i < 0 || target.i >= arr.length) return false;
    const id = arr.splice(target.i, 1)[0];
    addLog(G, s, 'Desguaza ' + CARDS[id].name + (target.zone === 'hand' ? ' de su mano' : ' de su descarte'), target.zone === 'hand' ? {k:'sx', c:id} : null);
  } else if (pd.t === 'sr') {
    const id = G.row[target.i]; if (!id) return false;
    G.row[target.i] = G.market.length ? G.market.pop() : ''; G.rv = (G.rv || 0) + 1;
    addLog(G, s, 'Retira ' + CARDS[id].name + ' de la feria', {k:'sx', c:id});
  } else if (pd.t === 'rc') {
    if (target.i < 0 || target.i >= p.discard.length) return false;
    const id = p.discard.splice(target.i, 1)[0]; p.deck.push(id);
    addLog(G, s, 'Rescata ' + CARDS[id].name + ' de su descarte y la pone sobre su mazo');
  } else if (pd.t === 'fr') {
    const id = G.row[target.i]; if (!id || CARDS[id].cost > pd.max) return false;
    G.row[target.i] = G.market.length ? G.market.pop() : ''; G.rv = (G.rv || 0) + 1; p.discard.push(id);
    addLog(G, s, 'Se lleva gratis ' + CARDS[id].name);
  } else if (pd.t === 'db') {
    const b = o.bases[target.i]; if (!b) return false;
    o.bases.splice(target.i, 1); o.discard.push(b.c);
    addLog(G, s, 'Derriba ' + CARDS[b.c].name + ' (' + pd.n + ')', {k:'hit', c:b.c});
  }

  return true;
}
function forcedDiscard(G, i){
  const s = G.turn, T = G.T, p = G.P[s];
  if (G.status !== 'playing' || T.need <= 0 || i < 0 || i >= p.hand.length) return false;
  const id = p.hand.splice(i, 1)[0]; p.discard.push(id); T.need--;
  if (!p.hand.length) T.need = 0;
  addLog(G, s, 'Descarta ' + CARDS[id].name);
  return true;
}
function startTurn(G){
  const s = G.turn, p = G.P[s];
  G.T = newTurn();
  G.T.need = Math.min(p.must, p.hand.length); p.must = 0;
  addLog(G, -1, 'Turno ' + G.turnNo);
  p.bases.forEach(b => { b.al = false; });
  p.bases.forEach(b => { if (G.status !== 'playing') return; const c = CARDS[b.c]; applyFx(G, c.p, c.name); addLog(G, s, c.name + ': ' + fxPlain(c.p)); });

}
function endTurn(G){
  if (G.status !== 'playing' || G.T.need > 0) return false;
  const s = G.turn, p = G.P[s];
  if (canHitFace(G)) { attackFace(G); if (G.status === 'over') return true; }
  G.T.play.forEach(e => p.discard.push(e.c));
  p.discard.push(...p.hand); p.hand = [];

  G.turn = 1 - s; G.turnNo++;

}

  G.status = 'over'; G.winner = 1 - s; addLog(G, s, 'Vende la finca y se rinde'); return true;
}

   IA de práctica
   ===================================================================== */
function aiStep(G){
  const s = G.turn, T = G.T, p = G.P[s], o = G.P[1 - s];
  if (T.need > 0) {
    let bi = 0; p.hand.forEach((id, i) => { if (CARDS[id].cost < CARDS[p.hand[bi]].cost) bi = i; });
    return forcedDiscard(G, bi);
  }
  if (p.hand.length) return playCard(G, Math.max(0, p.hand.findIndex(id => CARDS[id].p.dd)));
  if (T.pend.length) {
    const pd = T.pend[0];
    if (pd.t === 'sc') { const i = p.discard.findIndex(id => CARDS[id].cost === 0); if (i >= 0) return usePend(G, 0, {zone:'discard', i}); }
    if (pd.t === 'rc') { let bi = -1; p.discard.forEach((id, i) => { if (CARDS[id].cost >= 3 && (bi < 0 || CARDS[id].cost > CARDS[p.discard[bi]].cost)) bi = i; }); if (bi >= 0) return usePend(G, 0, {zone:'discard', i:bi}); }
    if (pd.t === 'fr') { let bi = -1; G.row.forEach((id, i) => { if (id && CARDS[id].cost <= pd.max && (bi < 0 || CARDS[id].cost > CARDS[G.row[bi]].cost)) bi = i; }); if (bi >= 0) return usePend(G, 0, {i:bi}); }
    if (pd.t === 'db' && o.bases.length) { let bi = 0; o.bases.forEach((b, i) => { if (CARDS[b.c].def > CARDS[o.bases[bi].c].def) bi = i; }); return usePend(G, 0, {i:bi}); }
    T.pend.splice(0, 1); return true;
  }
  let best = -2, bc = -1;
  G.row.forEach((id, i) => { if (id && CARDS[id].cost <= T.trade && CARDS[id].cost > bc) { bc = CARDS[id].cost; best = i; } });
  if (best >= 0) return buy(G, best);
  if (T.trade >= 2 && G.pile > 0 && G.turnNo < 14) return buy(G, -1);
  if (hasOutpost(o)) {
    let bi = -1; o.bases.forEach((b, i) => { const c = CARDS[b.c]; if (c.outpost && c.def <= T.combat && (bi < 0 || c.def < CARDS[o.bases[bi].c].def)) bi = i; });
    if (bi >= 0) return attackBase(G, bi);
  } else if (T.combat > 0) {
    if (T.combat < o.auth) { const bi = o.bases.findIndex(b => CARDS[b.c].def <= T.combat - 2); if (bi >= 0) return attackBase(G, bi); }
    return attackFace(G);
  }
  return endTurn(G);
}

async function openGame(code){

    if (S.G && (S.G.turn !== wasTurn || d.round !== wasRound)) { S.ui.mode = null; S.ui.confirmEnd = false; if (S.ui.modal && (S.ui.modal.type === 'sc' || S.ui.modal.type === 'rc')) S.ui.modal = null; noteTurn(); }

let writing = false, dirty = false;
async function flush(){

    catch (e) {

}

  if (net.p2p) { p2pRematch(); return; }
  const ref = net.db.doc('games/' + S.code), round = S.doc.round;
  try {
    let lease = null;
    try { lease = await ref.acquire({holder:net.myId, ttlMs:4000}); } catch (e) {}
    if (lease && lease.acquired === false) return;
    const snap = await ref.get(); if (!snap.exists) return;
    const d = snap.data(); if (d.round !== round) return;
    const loser = d.G && d.G.winner >= 0 ? 1 - d.G.winner : 0;
    const nd = Object.assign(clone(d), {status:'playing', round:round + 1, seq:1, updatedAt:Date.now(), G:newGame(loser)});

}

let rivalT = 0, offT = 0, roomAt = 0;
function rivalId(){ return S.mode === 'online' && S.doc ? (S.seat === 0 ? S.doc.p1 : S.doc.p0) : ''; }
function calcRival(){

  for (const p of peers) { const pr = p.presence || {}, id = p.by || pr.u; if (id !== rid) continue; if (pr.g === S.code) return 'game'; st = 'lobby'; }
  if (st === 'off' && Date.now() - roomAt < 3200) return 'unknown';

}

}

  try {
    room.onPeers(() => setRival(), dead);
    room.onConnection(on => { clearTimeout(offT); if (on) { if (net.offline) { net.offline = false; render(); } } else offT = setTimeout(() => { net.offline = true; render(); }, 3000); }, dead);
  } catch (e) { net.room = null; return; }

const isSmall = () => !!(window.matchMedia && matchMedia('(max-width:900px)').matches);

  S.mode = 'ai'; S.code = null; S.doc = null; S.seat = 0; S.G = newTutorial(); S.undo = []; S.tut = {step:0}; announce();
  S.view = 'game'; S.ui = {mode:null, modal:null, confirmEnd:false, sweep:0}; S.prevAuth = null;
  render();
}
function tutGate(d){
  // true: se permite la pulsación. Durante el tutorial solo vale la acción que se está enseñando.
  if (!S.tut || S.view !== 'game') return true;
  if (TUT_FREE.indexOf(d.act) >= 0) return true;
  const st = TUT[S.tut.step];
  if (st && st.act === d.act && (!st.ok || st.ok(d, S.G))) { S.tut.step++; return true; }
  const c = fxl.querySelector('.coach'); if (c && !calm()) c.animate([{translate:'-7px 0'}, {translate:'7px 0'}, {translate:'-4px 0'}, {translate:'0 0'}], {duration:260});
  return false;
}
function tutTurnBack(){
  if (!S.tut || !TUT[S.tut.step] || !TUT[S.tut.step].wait) return;
  S.tut = null; S.ui.modal = {type:'tutend'};
}
function placeCoach(){
  let c = fxl.querySelector('.coach');
  const st = S.tut && S.view === 'game' && !S.ui.modal && S.G && S.G.status === 'playing' ? TUT[S.tut.step] : null;
  if (!st) { if (c) c.remove(); return; }
  if (!c) { c = document.createElement('div'); c.className = 'coach'; fxl.appendChild(c); }
  if (c.dataset.step !== String(S.tut.step)) {
    c.dataset.step = S.tut.step;
    c.innerHTML = '<div class="n">Tutorial · paso ' + (S.tut.step + 1) + ' de ' + TUT.length + '</div><p>' + st.t + '</p><div class="f"><button class="skip" data-tut="skip">Saltar tutorial</button>' +
      (st.act ? '<span class="do">Pulsa lo que está resaltado</span>' : st.wait ? '<span class="do">Espera…</span>' : '<button class="next" data-tut="next">Siguiente</button>') + '</div>';
    if (!calm()) c.animate([{opacity:0, scale:'.94'}, {opacity:1, scale:'1'}], {duration:220, easing:'ease-out'});
  }
  const t = app.querySelector(st.sel), w = c.offsetWidth, h = c.offsetHeight, g = 18;
  if (t && S.tut.seen !== S.tut.step) { S.tut.seen = S.tut.step; try { t.scrollIntoView({block:'center', inline:'center'}); } catch (e) {} }
  let side = st.side, x = (innerWidth - w) / 2, y = (innerHeight - h) / 2;
  if (t) {
    t.classList.add(t.classList.contains('card') ? 'pick' : 'tut-ring');
    const r = t.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    if (side === 'top' && r.top - h - g < 54) side = 'bottom';
    if (side === 'bottom' && r.bottom + g + h > innerHeight - 8) side = 'top';
    if (side === 'left' || side === 'right') { const fl = r.left - w - g >= 8, fr = r.right + g + w <= innerWidth - 8; side = side === 'left' ? (fl ? 'left' : fr ? 'right' : '') : (fr ? 'right' : fl ? 'left' : ''); if (!side) side = r.top - h - g >= 54 ? 'top' : 'bottom'; }
    if (side === 'top') { x = cx - w / 2; y = r.top - h - g; }
    else if (side === 'bottom') { x = cx - w / 2; y = r.bottom + g; }
    else if (side === 'left') { x = r.left - w - g; y = cy - h / 2; }
    else { x = r.right + g; y = cy - h / 2; }
    x = Math.max(8, Math.min(innerWidth - w - 8, x)); y = Math.max(54, Math.min(innerHeight - h - 8, y));
    c.style.setProperty('--ax', Math.max(22, Math.min(w - 22, cx - x)) + 'px'); c.style.setProperty('--ay', Math.max(22, Math.min(h - 22, cy - y)) + 'px');
  } else side = 'none';
  c.className = 'coach s-' + side; c.style.left = x + 'px'; c.style.top = y + 'px';
}
fxl.addEventListener('click', e => {
  const b = e.target.closest('[data-tut]'); if (!b || !S.tut) return;
  if (b.dataset.tut === 'next') S.tut.step++; else S.tut = null;

let lpT = 0, lpDone = false, lpXY = null;
app.addEventListener('pointerdown', e => {
  clearTimeout(lpT); lpDone = false;
  if (e.pointerType === 'mouse' && !isSmall()) return;
  const el = e.target.closest('.card[data-card]'); if (!el || S.view !== 'game' || S.ui.modal) return;
  const id = el.dataset.card; lpXY = [e.clientX, e.clientY];

/* =====================================================================
   MODO DIRECTO (fuera de Claude): los dos navegadores se conectan entre sí con WebRTC.
   Un servicio público de emparejamiento (PeerJS) solo sirve para que se encuentren;
   la partida viaja de navegador a navegador y se guarda en cada uno por si se recarga la página.
   ===================================================================== */
const P2P = {peer:null, conn:null, role:null, lib:null, retryT:0, pingT:0, joinT:0, last:0, busy:false, tries:0, resume:false};
const PEER_PREFIX = 'fuera-de-mi-finca-';
function loadPeerLib(){
  if (window.Peer) return Promise.resolve();
  if (!P2P.lib) P2P.lib = new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'peerjs.min.js'; s.onload = () => window.Peer ? res() : rej(new Error('lib')); s.onerror = () => { P2P.lib = null; rej(new Error('lib')); }; document.head.appendChild(s); });
  return P2P.lib;
}
function p2pSave(){ try { if (S.code && S.doc && P2P.role) localStorage.setItem('ffmf-game', JSON.stringify({code:S.code, role:P2P.role, doc:S.doc, rival:net.names[P2P.role === 'host' ? 'guest' : 'host'] || '', t:Date.now()})); } catch (e) {} }
function p2pSaved(){ try { const v = JSON.parse(localStorage.getItem('ffmf-game') || 'null'); return v && v.doc && v.code && Date.now() - v.t < 2 * 864e5 ? v : null; } catch (e) { return null; } }
function p2pForget(){ try { localStorage.removeItem('ffmf-game'); } catch (e) {} }
function p2pClose(){
  clearTimeout(P2P.retryT); clearInterval(P2P.pingT); clearTimeout(P2P.joinT);
  const c = P2P.conn, p = P2P.peer; P2P.conn = P2P.peer = null; P2P.role = null; P2P.busy = false; P2P.resume = false;
  try { if (c) c.close(); } catch (e) {} try { if (p) p.destroy(); } catch (e) {}
  net.rival = 'unknown';
}
function p2pSend(msg){ const c = P2P.conn; if (c && c.open) { try { c.send(msg); return true; } catch (e) {} } return false; }
function p2pSendState(){ if (S.doc) p2pSend({t:'state', name:net.myName, doc:S.doc}); p2pSave(); }
function p2pErr(e){
  const t = e && e.type;
  if (t === 'browser-incompatible') return 'Este navegador no permite conexiones directas entre jugadores.';
  if (t === 'lib') return 'No se pudo cargar el módulo de conexión. Comprueba que peerjs.min.js está subido junto a index.html.';
  return 'No se pudo contactar con el servicio que empareja a los jugadores. Inténtalo de nuevo en un momento.';
}
function p2pEnter(code, role, doc){
  stopLobby(); clearTimeout(aiTimer);
  S.mode = 'online'; S.code = code; P2P.role = role; net.myId = role; S.doc = doc; S.G = doc.G || null; S.undo = []; S.tut = null;
  S.seat = role === 'host' ? 0 : 1; S.view = doc.G ? 'game' : 'wait';
  S.ui = {mode:null, modal:null, confirmEnd:false, sweep:0}; S.prevAuth = null; net.rival = 'off'; net.saveErr = '';
  setHash(code); noteTurn(); render();
}
function p2pOnData(m){
  P2P.last = Date.now();
  if (!m || typeof m !== 'object') return;
  const other = P2P.role === 'host' ? 'guest' : 'host';
  if (typeof m.name === 'string' && m.name) net.names[other] = m.name.slice(0, 16);
  if (m.t === 'hello') { render(); return; }
  if (m.t !== 'state' || !m.doc || m.doc.code !== S.code) return;
  const cur = S.doc;
  // empate (los dos piden revancha a la vez, o los dos traen la misma jugada): manda la copia de quien creó la partida
  if (cur && cur.G && m.doc.G && m.doc.round === cur.round && m.doc.seq === cur.seq && P2P.role === 'guest') cur.seq = m.doc.seq - 1;
  const was = S.doc ? S.doc.round + ':' + S.doc.seq : '';
  onGameSnap({exists:true, data:() => m.doc});
  if (S.doc && S.doc.round + ':' + S.doc.seq !== was) p2pSave(); else if (cur && cur.G && (cur.round > m.doc.round || (cur.round === m.doc.round && cur.seq > m.doc.seq))) p2pSendState();
}
function p2pWire(conn){
  const old = P2P.conn; P2P.conn = conn;
  if (old && old !== conn) { try { old.close(); } catch (e) {} }
  const down = () => { if (P2P.conn !== conn) return; net.rival = 'off'; render(); if (P2P.role === 'guest') p2pRetry(); };
  conn.on('open', () => {
    if (P2P.conn !== conn) return;
    clearTimeout(P2P.joinT); P2P.last = Date.now(); P2P.tries = 0; net.rival = 'game';
    if (P2P.role === 'host' && S.doc && !S.doc.G) {
      const nd = Object.assign(clone(S.doc), {status:'playing', round:1, seq:1, updatedAt:Date.now(), G:newGame(Math.random() < .5 ? 0 : 1)});
      onGameSnap({exists:true, data:() => nd});
    }
    if (S.doc && S.doc.G) p2pSendState(); else p2pSend({t:'hello', name:net.myName});
    render();
  });
  conn.on('data', p2pOnData);
  conn.on('close', down); conn.on('error', down);
}
function p2pRetry(){
  clearTimeout(P2P.retryT);
  if (P2P.role !== 'guest' || !P2P.peer) return;
  P2P.retryT = setTimeout(() => {
    const p = P2P.peer; if (!p || P2P.role !== 'guest' || (P2P.conn && P2P.conn.open)) return;
    try { if (p.disconnected && !p.destroyed) p.reconnect(); p2pWire(p.connect(PEER_PREFIX + S.code, {reliable:true})); } catch (e) {}
    p2pRetry();
  }, 3000);
}
function p2pPing(){
  clearInterval(P2P.pingT);
  P2P.pingT = setInterval(() => {
    const c = P2P.conn;
    if (c && c.open) { p2pSend({t:'ping'}); if (Date.now() - P2P.last > 12000 && net.rival === 'game') { net.rival = 'off'; render(); if (P2P.role === 'guest') { try { c.close(); } catch (e) {} p2pRetry(); } } }
    else if (P2P.peer && P2P.peer.disconnected && !P2P.peer.destroyed) { try { P2P.peer.reconnect(); } catch (e) {} }
  }, 4000);
}
async function p2pHost(code, doc){
  if (P2P.busy) return; P2P.busy = true; render();
  try { await loadPeerLib(); } catch (e) { P2P.busy = false; toast(p2pErr({type:'lib'})); render(); return; }
  const fresh = !doc;
  const open = tries => {
    if (fresh) code = genCode();
    const peer = new Peer(PEER_PREFIX + code, window.FINCA_PEER || {});
    P2P.peer = peer;
    peer.on('open', () => {
      P2P.busy = false; const now = Date.now();
      if (fresh || !S.doc) p2pEnter(code, 'host', doc || {code, status:'waiting', p0:'host', p1:'guest', createdAt:now, updatedAt:now, round:0, seq:0});
      p2pSave(); p2pPing(); render();
    });
    peer.on('connection', c => { if (P2P.peer === peer) p2pWire(c); });
    peer.on('disconnected', () => { if (P2P.peer === peer && !peer.destroyed) setTimeout(() => { try { if (P2P.peer === peer && peer.disconnected && !peer.destroyed) peer.reconnect(); } catch (e) {} }, 1500); });
    peer.on('error', e => {
      if (P2P.peer !== peer) return;
      if (e && e.type === 'unavailable-id' && tries < 8) { try { peer.destroy(); } catch (x) {} P2P.peer = null; setTimeout(() => { if (!P2P.peer && (fresh ? P2P.busy : P2P.role === 'host')) open(tries + 1); }, fresh ? 50 : 2500); return; }
      if (e && (e.type === 'peer-unavailable' || e.type === 'webrtc')) return;
      if (P2P.busy) { P2P.busy = false; p2pClose(); toast(p2pErr(e)); render(); } else { net.saveErr = p2pErr(e); render(); }
    });
  };
  if (doc) p2pEnter(code, 'host', doc);
  open(0);
}
async function p2pJoin(code, doc){
  code = String(code || '').trim().toLowerCase().replace(/[^a-z0-9-]/g, '');
  if (!code || P2P.busy) return;
  if (!code.startsWith('g-')) code = 'g-' + code;
  const saved = !doc && p2pSaved();
  if (saved && saved.code === code) { p2pResume(saved); return; }
  P2P.busy = true; render();
  try { await loadPeerLib(); } catch (e) { P2P.busy = false; toast(p2pErr({type:'lib'})); render(); return; }
  const now = Date.now();
  p2pEnter(code, 'guest', doc || {code, status:'waiting', p0:'host', p1:'guest', createdAt:now, updatedAt:now, round:0, seq:0});
  P2P.resume = !!doc;
  const peer = new Peer(window.FINCA_PEER || {});
  P2P.peer = peer;
  const giveUp = msg => { if (P2P.peer !== peer || P2P.resume) return; p2pClose(); S.view = 'lobby'; S.mode = null; S.code = null; S.doc = null; S.G = null; setHash(''); toast(msg); render(); };
  peer.on('open', () => {
    if (P2P.peer !== peer) return;
    P2P.busy = false; p2pWire(peer.connect(PEER_PREFIX + code, {reliable:true})); p2pPing(); render();
    P2P.joinT = setTimeout(() => { if (!(P2P.conn && P2P.conn.open)) giveUp('No se pudo conectar con tu vecino. Puede que la red de alguno de los dos no permita conexiones directas.'); }, 15000);
  });
  peer.on('disconnected', () => { if (P2P.peer === peer && !peer.destroyed) setTimeout(() => { try { if (P2P.peer === peer && peer.disconnected && !peer.destroyed) peer.reconnect(); } catch (e) {} }, 1500); });
  peer.on('error', e => {
    if (P2P.peer !== peer) return;
    if (e && e.type === 'peer-unavailable') { if (P2P.resume || (S.doc && S.doc.G)) p2pRetry(); else giveUp('No hay ninguna partida abierta con el código ' + showCode(code) + '. Quien la creó tiene que tener la página abierta.'); return; }
    if (e && e.type === 'webrtc') return;
    if (S.doc && S.doc.G) { net.saveErr = p2pErr(e); render(); } else { P2P.resume = false; P2P.busy = false; giveUp(p2pErr(e)); }
  });
}
function p2pResume(saved){
  net.names[saved.role === 'host' ? 'guest' : 'host'] = saved.rival || '';
  if (saved.role === 'host') p2pHost(saved.code, saved.doc); else p2pJoin(saved.code, saved.doc);
}
function p2pRematch(){
  const d = S.doc; if (!d || !d.G) return;
  const loser = d.G.winner >= 0 ? 1 - d.G.winner : 0;
  const nd = Object.assign(clone(d), {status:'playing', round:d.round + 1, seq:1, updatedAt:Date.now(), G:newGame(loser)});
  onGameSnap({exists:true, data:() => nd}); p2pSendState();
}

}
addEventListener('pagehide', () => { try { if (P2P.conn) P2P.conn.close(); if (P2P.peer) P2P.peer.destroy(); } catch (e) {} });

/* =====================================================================
   EVENTOS
   ===================================================================== */
const H = {
  create: () => net.p2p ? p2pHost() : createGame(),
  copylink: () => { const link = location.origin + location.pathname + '#' + S.code; try { navigator.clipboard.writeText(link).then(() => toast('Enlace copiado. Pégaselo a tu vecino.'), () => toast('No se pudo copiar. Selecciona el enlace y cópialo a mano.')); } catch (e) { toast('No se pudo copiar. Selecciona el enlace y cópialo a mano.'); } },
  ai: () => startAI(),
  joincode: () => { const v = (document.getElementById('joincode') || {}).value || ''; if (v.trim()) (net.p2p ? p2pJoin(v) : openGame(v)); else toast('Escribe el código de 4 caracteres de la partida.'); },
  open: d => net.p2p ? p2pJoin(d.code) : openGame(d.code),
  cancel: d => { S.ui.modal = {type:'confirm', title:'Borrar partida', text:net.p2p ? 'La partida ' + showCode(d.code) + ' se borrará de este navegador.' : 'La partida ' + showCode(d.code) + ' se eliminará para los dos jugadores.', yes:'cancelyes', label:'Borrar partida', code:d.code}; render(); },
  cancelyes: d => { S.ui.modal = null; if (net.p2p) { p2pForget(); if (S.view === 'lobby') render(); else goLobby(); } else { cancelGame(d.code); render(); } },
  leave: () => goLobby(),
  rules: () => { S.ui.modal = {type:'rules'}; render(); },
  closemodal: () => { S.ui.modal = null; render(); },
  log: () => { S.ui.modal = {type:'log'}; render(); },
  undo: () => undo(),
  tutorial: () => startTutorial(),
  tutcontinue: () => { S.ui.modal = null; noteTurn(); render(); },
  veil: (d, el, e) => { if (e.target === el) { S.ui.modal = null; render(); } },
  pile: d => { S.ui.modal = {type:'pile', who:+d.who}; render(); },
  play: d => act(G => playCard(G, +d.i)),
  discard: d => act(G => forcedDiscard(G, +d.i)),
  playall: () => act(G => playAll(G)),
  buy: d => act(G => buy(G, +d.i)),
  hitbase: d => act(G => attackBase(G, +d.i)),
  face: () => act(G => attackFace(G)),
  scrapself: d => act(G => scrapSelf(G, d.zone, +d.i)),
  pend: d => {
    const G = S.G, pd = G && G.T.pend[+d.i]; if (!pd || G.turn !== S.seat) return;
    if (pd.t === 'sc' || pd.t === 'rc') S.ui.modal = {type:pd.t, pi:+d.i}; else S.ui.mode = {t:pd.t, pi:+d.i, max:pd.max};
    render();
  },
  cancelmode: () => { S.ui.mode = null; render(); },
  pendtarget: d => {
    const m = S.ui.modal && (S.ui.modal.type === 'sc' || S.ui.modal.type === 'rc') ? {pi:S.ui.modal.pi} : S.ui.mode; if (!m) return;
    const pi = m.pi; S.ui.mode = null; S.ui.modal = null;
    act(G => usePend(G, pi, {zone:d.zone, i:+d.i})); render();
  },
  end: () => {
    const G = S.G; if (!G || G.turn !== S.seat) return;
    const p = G.P[S.seat], cheapest = Math.min(...G.row.filter(Boolean).map(id => CARDS[id].cost), G.pile > 0 ? 2 : 99);
    if (!S.tut && !S.ui.confirmEnd && (p.hand.length || G.T.trade >= cheapest)) { S.ui.confirmEnd = true; render(); return; }
    S.ui.mode = null; act(G => endTurn(G));
  },
  resign: () => { S.ui.modal = {type:'confirm', title:'Rendirse', text:'Tu vecino ganará la partida.', yes:'resignyes', label:'Rendirme'}; render(); },
  resignyes: () => { S.ui.modal = null; act(G => resign(G, S.seat)); render(); },
  rematch: () => rematch()
};
app.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = H[el.dataset.act]; if (fn && tutGate(el.dataset)) fn(el.dataset, el, e);
});
app.addEventListener('input', e => { if (e.target.id === 'nick') { net.myName = e.target.value.trim().slice(0, 16); try { localStorage.setItem('ffmf-nick', net.myName); } catch (x) {} } });
app.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'joincode') { H.joincode(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[role="button"][data-act]')) { e.preventDefault(); e.target.click(); }
  if (e.key === 'Escape' && (S.ui.modal || S.ui.mode)) { S.ui.modal = null; S.ui.mode = null; render(); }
  if ((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z') && S.view === 'game' && !S.ui.modal) { e.preventDefault(); undo(); }
});
document.addEventListener('keydown', e => {
  if (app.contains(e.target)) return;
  if (e.key === 'Escape' && (S.ui.modal || S.ui.mode)) { S.ui.modal = null; S.ui.mode = null; render(); }
  if ((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z') && S.view === 'game' && !S.ui.modal) { e.preventDefault(); undo(); }
});
/* carta señalada: su explicación sale en el recuadro fijo de la derecha, nunca encima de la mesa */
function showInfo(el){
  if (S.view !== 'game' || !el) return;
  const id = el.dataset.card; if (S.ui.inspect === id) return;
  S.ui.inspect = id; const box = document.getElementById('info'); if (box) { box.innerHTML = infoHTML(id); box.scrollTop = 0; }
}
app.addEventListener('mouseover', e => showInfo(e.target.closest('.card[data-card]')));
app.addEventListener('focusin', e => showInfo(e.target.closest && e.target.closest('.card[data-card]')));

/* ---- fondo: mesa de tablones ---- */
function land(){
  const cv = document.getElementById('land'), dpr = Math.min(window.devicePixelRatio || 1, 2), w = innerWidth, h = innerHeight;
  cv.width = w * dpr; cv.height = h * dpr;
  const x = cv.getContext('2d'); x.scale(dpr, dpr);
  let seed = 23; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const cols = ['#3b2613', '#422b15', '#35210f', '#472e17', '#3e2812'];
  for (let y = 0; y < h;) {
    const ph = 96 + rnd() * 44;
    x.fillStyle = cols[Math.floor(rnd() * cols.length)]; x.fillRect(0, y, w, ph);
    for (let k = 0; k < 16; k++) {
      const gy = y + 4 + rnd() * (ph - 8), amp = 1 + rnd() * 3, len = 140 + rnd() * 260, ph0 = rnd() * 6;
      x.strokeStyle = rnd() > .35 ? 'rgba(0,0,0,' + (.08 + rnd() * .12) + ')' : 'rgba(255,214,150,.05)'; x.lineWidth = 1;
      x.beginPath(); for (let px = 0; px <= w; px += 24) { const yy = gy + Math.sin(px / len + ph0) * amp; if (px) x.lineTo(px, yy); else x.moveTo(px, yy); } x.stroke();
    }
    if (rnd() > .45) { const kx = rnd() * w, ky = y + ph * (.3 + rnd() * .4); for (let r = 3; r < 15; r += 3.5) { x.strokeStyle = 'rgba(0,0,0,.2)'; x.beginPath(); x.ellipse(kx, ky, r * 1.9, r, 0, 0, 7); x.stroke(); } x.fillStyle = 'rgba(20,10,4,.55)'; x.beginPath(); x.ellipse(kx, ky, 4.5, 2.6, 0, 0, 7); x.fill(); }
    const jx = rnd() * w; x.fillStyle = 'rgba(0,0,0,.4)'; x.fillRect(jx, y, 2, ph);
    x.fillStyle = 'rgba(0,0,0,.55)'; x.fillRect(0, y + ph - 2, w, 2); x.fillStyle = 'rgba(255,214,150,.05)'; x.fillRect(0, y, w, 1);
    y += ph;
  }
  const g = x.createRadialGradient(w / 2, h / 2, Math.min(w, h) * .3, w / 2, h / 2, Math.max(w, h) * .75);
  g.addColorStop(0, 'rgba(12,7,2,.12)'); g.addColorStop(1, 'rgba(12,7,2,.6)');
  x.fillStyle = g; x.fillRect(0, 0, w, h);
}
let landT = 0; addEventListener('resize', () => { clearTimeout(landT); landT = setTimeout(land, 150); });

/* ---- arranque ---- */
async function start(saved){
  saved = saved || {};
  land(); render();
  if (saved.ai && saved.ai.P) { S.mode = 'ai'; S.G = saved.ai; S.seat = 0; S.view = 'game'; render(); aiMaybe(); }
  const startDirect = () => {
    net.p2p = true; net.ready = true;
    try { net.myName = (localStorage.getItem('ffmf-nick') || '').slice(0, 16); } catch (e) {}
    const h = ((location.hash || '').slice(1) || '').toLowerCase();
    if (S.mode !== 'ai' && /^g-[a-z0-9]{4}$/.test(h)) p2pJoin(h);
    render();
  };
  // fuera de Claude no hay servidor de partidas: se juega en conexión directa
  if (!(window.claude && window.claude.use) && window.top === window.self) { startDirect(); return; }
  const [db, user, room] = await Promise.all([cap('db'), cap('user'), cap('room')]);
  if (!(window.claude && window.claude.use)) { startDirect(); return; }
  net.db = db; net.user = user;
  if (user) {
    try { net.myId = await user.id(); } catch (e) {}
    try { const me = await user.me(); net.myName = (me && me.name) || ''; } catch (e) {}
    try { net.canWrite = await user.can('data.write'); } catch (e) {}
  }
  if (!net.myId) net.myId = localId();
  net.ready = true;
  initRoom(room);
  if (db && S.mode !== 'ai') {
    subscribeLobby();
    const h = (saved.code || (location.hash || '').slice(1) || '').toLowerCase();
    if (/^g-[a-z0-9]{4}$/.test(h)) openGame(h);
  }
  render();
}
try { if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({code:S.mode === 'online' ? S.code : null, ai:S.mode === 'ai' ? S.G : null})); } catch (e) {}
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
